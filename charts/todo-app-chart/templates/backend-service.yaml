apiVersion: v1
kind: Service
metadata:
  name: todo-backend
  labels:
    {{- include "todo-app-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: {{ include "todo-app-chart.name" . }}-backend