apiVersion: v1
kind: Service
metadata:
  name: todo-gateway
  labels:
    {{- include "todo-app-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: {{ .Values.gateway.service.type }}
  ports:
    - port: {{ .Values.gateway.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: {{ include "todo-app-chart.name" . }}-gateway