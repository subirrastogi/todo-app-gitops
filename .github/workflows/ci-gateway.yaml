name: API Gateway CI Workflow

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'apps/api-gateway/**'
      - '.github/workflows/ci-gateway.yaml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: |
          cd apps/api-gateway
          mvn clean package -DskipTests

      - name: Extract Commit SHA
        id: vars
        run: echo "SHA_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api-gateway
          file: ./apps/api-gateway/Dockerfile
          push: true
          tags: |
            quay.io/${{ secrets.REGISTRY_ORG }}/todo-api-gateway:${{ steps.vars.outputs.SHA_SHORT }}
            quay.io/${{ secrets.REGISTRY_ORG }}/todo-api-gateway:dev-latest

      - name: Install yq
        uses: mikefarah/yq@v4.44.1

      - name: Update GitOps Dev Values
        run: |
          IMAGE_TAG="${{ steps.vars.outputs.SHA_SHORT }}"
          FILE="gitops/environments/dev/values-dev.yaml"

          yq eval ".gateway.image.tag = \"${IMAGE_TAG}\"" -i ${FILE}

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${FILE}

          if ! git diff-index --quiet HEAD; then
            git commit -m "chore(gitops): update gateway image tag to ${IMAGE_TAG} [skip ci]"
            # Fetch latest remote commits and replay local commit on top
            git pull --rebase origin main
            git push origin main
          fi