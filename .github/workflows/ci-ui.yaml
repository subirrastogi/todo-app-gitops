name: UI CI Workflow

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'apps/ui/**'
      - '.github/workflows/ci-ui.yaml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/ui/package-lock.json

      - name: Install Dependencies & Build Angular
        run: |
          cd apps/ui
          npm ci --legacy-peer-deps
          npm run build -- --configuration=production

      - name: Extract Commit SHA
        id: vars
        run: echo "SHA_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/ui
          file: ./apps/ui/Dockerfile
          push: true
          tags: |
            quay.io/${{ secrets.REGISTRY_ORG }}/todo-ui:${{ steps.vars.outputs.SHA_SHORT }}
            quay.io/${{ secrets.REGISTRY_ORG }}/todo-ui:dev-latest

      - name: Install yq
        uses: mikefarah/yq@v4.44.1

      - name: Update GitOps Dev Values
        run: |
          IMAGE_TAG="${{ steps.vars.outputs.SHA_SHORT }}"
          FILE="gitops/environments/dev/values-dev.yaml"

          # 1. Configure Bot Identity
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 2. Clean up any unstaged changes
          git reset --hard HEAD
          git clean -fd

          # 3. Rebase first to ensure we are on the latest remote HEAD
          git pull --rebase origin main

          # 4. Update the YAML file
          yq eval ".ui.image.tag = \"${IMAGE_TAG}\"" -i ${FILE}

          # 5. Commit and Push ONLY the values file
          git add ${FILE}
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore(gitops): update ui image tag to ${IMAGE_TAG} [skip ci]"
            git push origin main
          fi