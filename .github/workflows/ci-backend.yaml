name: Backend CI Workflow

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'apps/backend/**'
      - '.github/workflows/ci-backend.yaml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: |
          cd apps/backend
          mvn clean package -DskipTests

      - name: Extract Commit SHA
        id: vars
        run: echo "SHA_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          push: true
          tags: |
            quay.io/${{ secrets.REGISTRY_ORG }}/todo-backend:${{ steps.vars.outputs.SHA_SHORT }}
            quay.io/${{ secrets.REGISTRY_ORG }}/todo-backend:dev-latest

      - name: Install yq
        uses: mikefarah/yq@v4.44.1

      - name: Update GitOps Dev Values
        run: |
          IMAGE_TAG="${{ steps.vars.outputs.SHA_SHORT }}"
          FILE="gitops/environments/dev/values-dev.yaml"

          # 1. Configure Bot Identity
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 2. Clean up any unstaged changes
          git reset --hard HEAD
          git clean -fd

          # 3. Rebase first to ensure we are on the latest remote HEAD
          git pull --rebase origin main

          # 4. Update the YAML file
          yq eval ".backend.image.tag = \"${IMAGE_TAG}\"" -i ${FILE}

          # 5. Commit and Push ONLY the values file
          git add ${FILE}
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore(gitops): update backend image tag to ${IMAGE_TAG} [skip ci]"
            git push origin main
          fi