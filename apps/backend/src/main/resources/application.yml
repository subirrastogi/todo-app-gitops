server:
  port: 8080

spring:
  application:
    name: todo-backend
  threads:
    virtual:
      enabled: true  # Java 21 Virtual Threads
  datasource:
    url: jdbc:h2:mem:tododb
    driverClassName: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update